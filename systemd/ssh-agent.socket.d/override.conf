# Begränsa ssh-agent-socketen till enbart owner (0600).
#
# Upstream-enheten /usr/lib/systemd/user/ssh-agent.socket anger ingen
# SocketMode, vilket gör att systemd faller tillbaka på 0666. Det gör socketen
# världsläsbar, och därmed kan VARJE lokal användare på maskinen ansluta till
# agenten och använda din privata nyckel - utan att känna till lösenordet.
#
# Installera till:
#   ~/.config/systemd/user/ssh-agent.socket.d/override.conf
# och aktivera med:
#   systemctl --user daemon-reload
#   systemctl --user restart ssh-agent.socket
[Socket]
SocketMode=0600